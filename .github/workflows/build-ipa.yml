name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*", "native-v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Generate project
        working-directory: native
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' AIInputStatus.xcodeproj/project.pbxproj
          sed -i '' 's/Xcode 16.0/Xcode 15.0/' AIInputStatus.xcodeproj/project.pbxproj
      - name: Build unsigned app
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild \
            -project AIInputStatus.xcodeproj \
            -scheme AIInputStatus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build 2>&1 | tee xcodebuild.log
      - name: Publish build diagnostics
        if: failure()
        working-directory: native
        run: |
          if [ -f xcodebuild.log ]; then
            grep -E '(^|[[:space:]])(error|fatal error):' xcodebuild.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
      - name: Package IPA
        working-directory: native
        run: |
          APP_PATH="native/build/AIInputStatus.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/AIInputStatus"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          test "$VERSION" = "3.2.0"
          test "$BUILD" = "5"
          echo "Verified native IPA version $VERSION ($BUILD)"
          rm -rf native/Payload native/AI-INPUT-Status-v3.2.0.ipa
          mkdir native/Payload
          cp -R "$APP_PATH" native/Payload/
          /usr/bin/zip -qry native/AI-INPUT-Status-v3.2.0.ipa native/Payload
          unzip -l native/AI-INPUT-Status-v3.2.0.ipa
          unzip -p native/AI-INPUT-Status-v3.2.0.ipa native/Payload/AIInputStatus.app/Info.plist | plutil -p -
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-INPUT-Status-v3.2.0
          path: native/AI-INPUT-Status-v3.2.0.ipa
          if-no-files-found: error
